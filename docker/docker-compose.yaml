services:
  # mysql
  geek-agent-mysql:
    image: registry.cn-shenzhen.aliyuncs.com/geekmaster/mysql:8.0.33
    container_name: geek-agent-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - '3308:3306'
    volumes:
      - ./conf/mysql/my.cnf:/etc/mysql/my.cnf
      - ./data/mysql/data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./data/mysql/init.d:/docker-entrypoint-initdb.d/

  # redis
  geek-agent-redis:
    image: registry.cn-shenzhen.aliyuncs.com/geekmaster/redis:6.0.6
    restart: always
    container_name: geek-agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      - '6381:6379'

  geek-agent-api:
    image: registry.cn-shenzhen.aliyuncs.com/geekmaster/geek-agent-api:v1.0.1-amd64
    container_name: geek-agent-api
    restart: always
    ports:
      - '6789:6789'
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime
      - ./conf/config.toml:/var/www/app/config.toml
      - ./logs:/var/www/app/logs
      - ./static:/var/www/app/static
    environment:
      - LOG_LEVEL=info
      - CONFIG_FILE=config.toml
      - GEEKAI_MYSQL_DSN=root:${MYSQL_ROOT_PASSWORD}@tcp(geek-agent-mysql:3306)/geekai_agent?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=True&loc=Local
      - GEEKAI_REDIS_PASSWORD=${REDIS_PASSWORD}
      - GEEKAI_SESSION_SECRET=${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      - GEEKAI_ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?请在 .env 中设置 ADMIN_SESSION_SECRET}
      - GEEKAI_APP_CONFIG_KEY=${APP_CONFIG_KEY:?请在 .env 中设置 APP_CONFIG_KEY}
      - GEEKAI_ADMIN_USERNAME=${ADMIN_USERNAME:?请在 .env 中设置 ADMIN_USERNAME}
      - GEEKAI_ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}

    # 前端应用
  geek-agent-web:
    image: registry.cn-shenzhen.aliyuncs.com/geekmaster/geek-agent-web:v1.0.1-amd64
    container_name: geek-agent-web
    restart: always
    depends_on:
      - geek-agent-api
    ports:
      - '8081:8080'
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./conf/nginx/conf.d:/etc/nginx/conf.d
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
